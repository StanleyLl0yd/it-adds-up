name: Release preparation
on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign production artifacts (requires owner-provided secrets and environment approval)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  devices:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/android-ui.yml
  verify:
    needs: devices
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew spotlessCheck testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - name: Package unsigned release evidence
        run: |
          mkdir release-artifacts
          cp app/build/outputs/apk/release/*-unsigned.apk release-artifacts/
          cp app/build/outputs/bundle/release/*.aab release-artifacts/
          cp CHANGELOG.md release-artifacts/
          python3 scripts/release_metadata.py release-artifacts unsigned
      - name: Attest unsigned Android binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/*.apk
            release-artifacts/*.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-${{ github.sha }}
          path: release-artifacts/
          retention-days: 30
  sign:
    if: inputs.signed && github.ref == 'refs/heads/main'
    needs: verify
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build with owner-provided production signing
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
        run: |
          set -eu
          test -n "$RELEASE_STORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          python3 -c 'import os,base64; open(os.environ["RELEASE_STORE_FILE"],"wb").write(base64.b64decode(os.environ["RELEASE_STORE_BASE64"],validate=True))'
          ./gradlew assembleRelease bundleRelease
          mkdir signed-release
          cp app/build/outputs/apk/release/app-release.apk signed-release/
          cp app/build/outputs/bundle/release/app-release.aab signed-release/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose signed-release/app-release.apk
          python3 scripts/release_metadata.py signed-release signed
      - name: Attest signed Android binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            signed-release/*.apk
            signed-release/*.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: signed-release/
          retention-days: 30
