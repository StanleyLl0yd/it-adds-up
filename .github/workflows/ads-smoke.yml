name: Ads SDK smoke
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  yandex-test-banner:
    name: Yandex official test banner
    if: github.event.label.name == 'yandex-smoke-approved' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'StanleyLl0yd'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash scripts/run-emulator.sh 36 yandex
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-yandex-test-${{ github.sha }}
          path: |
            ads-test.txt
            emulator.log
            screenshots/
