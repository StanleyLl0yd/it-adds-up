name: Android UI
on:
  workflow_call:
  pull_request:
    paths: ['app/**', '*.gradle.kts', 'gradle/**', '.github/workflows/android-ui.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device:
    name: Android device API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device checks with existing SDK licenses
        run: bash scripts/run-emulator.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-ui-api-${{ matrix.api }}-${{ github.sha }}
          path: |
            screenshots/
            device-tests.txt
            emulator.log
          retention-days: 14
